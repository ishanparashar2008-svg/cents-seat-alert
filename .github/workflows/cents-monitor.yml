name: CEnT-S seat monitor

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 min (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write # needed to save state.json back to the repo

concurrency:
  group: cents-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check CISIA calendar
        run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "Update seat state"
            git pull --rebase -q || true
            git push
          fi
